name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  efi-tree:
    name: make_efi (${{ matrix.profile }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [generic-x64, 15igl7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shipped binary against MANIFEST.sha256
        shell: bash
        run: cd bin && tr -d '\r' < MANIFEST.sha256 | sha256sum -c -
      - name: Build EFI tree (downloads pinned OpenCore, runs ocvalidate)
        run: python tools/make_efi.py --profile ${{ matrix.profile }} --out out/${{ matrix.profile }} --force
      - name: Show receipt
        shell: bash
        run: cat out/${{ matrix.profile }}/efi-receipt.json
      - name: Apply EFI tree to a scratch folder (Windows USB tool, non-destructive mode)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scratch | Out-Null
          .\tools\make-usb.ps1 -EfiDir out\${{ matrix.profile }} -EspRoot (Resolve-Path scratch).Path
